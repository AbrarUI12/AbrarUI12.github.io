<style>
.cv-page { max-width: 900px; margin: 5.5rem auto 3rem; padding: 1.5rem; background: var(--container-color); border: 1px solid var(--border-color); border-radius: 1rem; }
.cv-page h1 { font-size: 1.75rem; color: var(--title-color); }
.cv-page h2 { color: var(--title-color); font-size: 1rem; padding-bottom: .25rem; border-bottom: 1px solid var(--border-color); margin: 1.3rem 0 .6rem; }
.cv-page h3 { color: var(--title-color); font-size: .96rem; margin: .75rem 0 .35rem; }
.cv-page p { margin-bottom: .5rem; }
.cv-page ul { list-style: disc; margin-left: 1.4rem; }
.cv-page li { margin: .4rem 0; }
.cv-meta, .cv-links { margin: .4rem 0; }
.cv-links a { color: var(--first-color); text-decoration: underline; margin-right: .8rem; }
.cv-actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.cv-pdf-preview { display: block; width: 100%; height: min(80vh, 980px); min-height: 480px; margin-top: 1rem; border: 1px solid var(--border-color); border-radius: .5rem; background: #fff; }
@media (max-width: 540px) { .cv-pdf-preview { min-height: 440px; height: 70vh; } }
@media (max-width: 540px) { .cv-page { margin: 5rem .75rem 2rem; padding: 1.05rem; } .cv-page h1 { font-size: 1.4rem; } .cv-actions .button { flex: 1 1 auto; } }
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: white !important; color: black !important; font-family: Arial,sans-serif; font-size: 9pt; }
  .header, .cv-actions, .skip-link { display: none !important; }
  .cv-pdf-preview { height: 90vh; border: none; }
  .cv-page { max-width: unset; margin: 0; padding: 0; border: none; border-radius: 0; box-shadow: none; background: #fff !important; color: #000 !important; }
  .cv-page h1, .cv-page h2, .cv-page h3 { color: black !important; }
  .cv-page h2 { break-after: avoid; margin: .6rem 0 .3rem; }
  .cv-page h3 { break-after: avoid; margin: .45rem 0 .2rem; }
  .cv-page li { margin: .15rem 0; }
  .cv-page a { color: black !important; }
}
</style>
</head>
<body>
<script>
  // Apply the homepage's saved theme before the CV is painted.
  try {
    if (localStorage.getItem('selected-theme') === 'dark') {
      document.body.classList.add('dark-theme');
    }
  } catch (_) { /* Theme preference unavailable; use light mode. */ }
</script>
<header class="header">

      <button class="theme-toggle" id="theme-button" type="button" aria-label="Toggle dark and light theme" title="Toggle dark and light theme">
        <i class="ri-moon-line" aria-hidden="true"></i>
      </button>
    </div>
  </nav>
</header>
<main class="cv-page">
<div class="cv-actions"><a class="button" href="./assets/docs/cv.pdf" download="Mir_Abrar_CV.pdf" type="application/pdf">Download Original CV (PDF)</a><a class="button button--ghost" href="./assets/docs/cv.pdf" target="_blank" rel="noopener" type="application/pdf">View Original PDF</a><a class="button button--ghost" href="./index.html">Portfolio</a></div>

</main>
